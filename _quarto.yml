project:
  type: website
  render:
    - "*.qmd"
    - "*.md"
    - "!AGENTS.md"
    - "!docs/agents/"
  title: "QC Benchmark for Nanopore Reads"

format:
  html:
    embed-resources: false
    theme:
      light: flatly
      dark: darkly
    filters:
      - shinylive
    toc: true
    code-fold: true
    code-copy: true
    fig-align: center
    smooth-scroll: true
    lightbox: true
    link-external-newwindow: true
    fontsize: "12"
    page-layout: article
    grid:
      body-width: 1200px

website:
  search: true
  navbar:
    background: primary
    left:
      - text: QC Tool Selection
        href: tool_weighting.qmd
      - text: Methods & Robustness
        href: methods_and_robustness.qmd
